name: Code Proofs CI & Secret Sanitization Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-code-proofs-and-sanitization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Secret & Credential Leak Audit (Fail-Closed)
        run: |
          if grep -RInE "AIzaSy[A-Za-z0-9_-]{10,}|sk-ant-[A-Za-z0-9_-]{10,}|BEGIN PRIVATE KEY|password:[[:space:]]*12345" README.md docs/ code-proofs/; then
            echo "::error::Unredacted credential pattern detected in repository!"
            exit 1
          fi
          echo "Zero leaked secrets detected."

      - name: Set up JDK 21 LTS
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'code-proofs/pom.xml'

      - name: Run Zero-Bytecode Code Proofs Test Suite
        working-directory: code-proofs
        run: mvn -B clean test
